name: levexauto
description: "A Flutter Mobile app project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  flutter_bounceable: ^1.1.0
  flutter_carousel_widget: ^2.2.0
  readmore: ^3.0.0

  # TOAST
  fluttertoast: ^8.2.5

  # STATE MANAGEMENT
  get: ^4.6.6
  intl:

  # FIREBASE
  firebase_core: ^2.29.0
  firebase_auth: ^4.19.1
  cloud_firestore: ^4.16.1
  firebase_storage: ^11.7.1

  # IMAGE PICKER
  image_picker: ^1.0.8

  # LOCATION
  location: ^6.0.1
  geoflutterfire2: ^2.3.15
  geocoding: ^3.0.0

  # LOCAL DATABASE
  shared_preferences: ^2.2.3

  # URL LAUNCHER
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.2

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/
    - assets/images/
    - assets/

